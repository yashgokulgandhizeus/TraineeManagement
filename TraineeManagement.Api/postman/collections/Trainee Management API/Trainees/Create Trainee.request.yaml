$kind: http-request
name: Create Trainee
method: POST
url: '{{base_url}}/api/Trainees'
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "firstName": "John",
      "lastName": "Doe",
      "email": "john.doe@example.com",
      "techStack": "React, Node.js",
      "status": "Active"
    }
