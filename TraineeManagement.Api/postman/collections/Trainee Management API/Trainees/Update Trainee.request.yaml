$kind: http-request
name: Update Trainee
method: PUT
url: '{{base_url}}/api/Trainees/:id'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
pathVariables:
  - key: id
    value: '1'
body:
  type: json
  content: |-
    {
      "firstName": "John",
      "lastName": "Doe",
      "email": "john.doe@example.com",
      "techStack": "React, Node.js, TypeScript",
      "status": "Active"
    }
